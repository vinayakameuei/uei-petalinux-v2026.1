#UEI Configuration
require conf/machine/include/uei-zynq-base.inc

# Enable auto-resize to match rootfs size
WIC_CREATE_EXTRA_ARGS = "--resize-rootfs"

HOSTTOOLS:append = " svn"

IMAGE_INSTALL:remove = "qtwebkit"

## Uncomment below line if you need to build offline
#SOURCE_MIRROR_URL ?= "http://10.221.7.142:8080/"
#SOURCE_MIRROR_URL ?= "file:///home/your-download-dir"
INHERIT += "own-mirrors"
#BB_NO_NETWORK = "1"
PREMIRRORS:prepend = " \
   http://.*/.* ${SOURCE_MIRROR_URL} \n \
   https://.*/.* ${SOURCE_MIRROR_URL} \n \
   git://.*/.* ${SOURCE_MIRROR_URL} \n"
IMAGE_BOOT_FILES:zynqmp = "Image system-top-4ev.dtb system-top-4eg.dtb system-top-9eg-tsn.dtb"
