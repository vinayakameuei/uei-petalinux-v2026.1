#UEI Configuration
require conf/machine/include/uei-zynq-base.inc

# Enable auto-resize to match rootfs size
WIC_CREATE_EXTRA_ARGS = "--resize-rootfs"

HOSTTOOLS:append = " svn"

IMAGE_INSTALL:remove = "qtwebkit"

## Source mirror is the UEI package feed; set UEI_FEED_URL in conf/machine/include/uei-zynq-base.inc
SOURCE_MIRROR_URL ?= "${UEI_FEED_URL}/"
INHERIT += "own-mirrors"
#BB_NO_NETWORK = "1"
PREMIRRORS:prepend = " \
   http://.*/.* ${SOURCE_MIRROR_URL} \n \
   https://.*/.* ${SOURCE_MIRROR_URL} \n"
IMAGE_BOOT_FILES:zynqmp = "BOOT.BIN boot.scr Image"
