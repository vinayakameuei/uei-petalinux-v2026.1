# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
	${LAYERDIR}/recipes-*/*/*.bbappend"

# Define dynamic layers
BBFILES_DYNAMIC += " \
xilinx-tools:${LAYERDIR}/meta-xilinx-tools/recipes-*/*/*.bbappend \
"

BBFILE_COLLECTIONS += "meta-user"
BBFILE_PATTERN_meta-user = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-user = "7"
LAYERSERIES_COMPAT_meta-user = "scarthgap"
HOSTTOOLS:append = " svn"

DISTRO_FEATURES:append = " security selinux"

PREFERRED_PROVIDER_virtual/refpolicy = "${@bb.utils.contains("DISTRO_FEATURES", "selinux", "refpolicy-minimum", "" ,d)}"

# uutils-coreutils needs clang-native for SELinux builds, but this BSP does not
# include meta-clang. Keep using GNU coreutils from oe-core.
PREFERRED_PROVIDER_coreutils = "coreutils"
BBMASK += "meta-openembedded/meta-oe/recipes-core/uutils-coreutils/"
