#/etc/inetd.conf:  see inetd(8) for further informations.
#
# Internet server configuration database
#
# If you want to disable an entry so it isn't touched during
# package updates just comment it out with a single '#' character.
#
# <service_name> <sock_type> <proto> <flags> <user> <server_path> <args>
#
#:INTERNAL: Internal services
#echo          stream  tcp     nowait  root    internal
#echo          dgram   udp     wait    root    internal
#chargen       stream  tcp     nowait  root    internal
#chargen       dgram   udp     wait    root    internal
#discard               stream  tcp     nowait  root    internal
#discard               dgram   udp     wait    root    internal
#daytime               stream  tcp     nowait  root    internal
#daytime       dgram   udp     wait    root    internal
#time          stream  tcp     nowait  root    internal
#time          dgram   udp     wait    root    internal
#telnet stream  tcp     nowait  root    telnetd telnetd -i
#ftp    stream  tcp     nowait  root    ftpd    ftpd -w /var/ftp/
telnet          stream  tcp     nowait  root    /usr/sbin/telnetd       telnetd -i
pdnaserver dgram   udp  wait    root    /usr/bin/pdnaserver             pdnaserver -s 0 -i lo
pdnaservera dgram   udp wait    root    /usr/bin/pdnaserver             pdnaserver -s 0 -a 1 -p 6344 -i lo
pdnaservers dgram   udp wait    root    /usr/bin/pdnaserver             pdnaserver -s 0 -t 1 -p 6354 -i lo
